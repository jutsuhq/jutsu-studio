name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: scripts/check-secrets.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint.sh

  # The image matches the Xcode the app is developed with: on macos-26's Xcode 26.6, SwiftPM leaves string catalogs
  # uncompiled and the media tests' video encoding hangs.
  macos:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version
      - name: Build package tests
        run: |
          swift build --build-tests --package-path Packages/HiggsfieldKit
          swift build --build-tests --package-path Packages/JutsuKit
      # The tests take seconds; a hang fails fast instead of holding a runner for hours.
      - name: Package tests
        timeout-minutes: 2
        run: scripts/test.sh all --skip-build
      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: Build app
        run: |
          xcodegen generate
          xcodebuild -project JutsuStudio.xcodeproj -scheme JutsuStudio -destination 'platform=macOS' \
            -quiet build CODE_SIGNING_ALLOWED=NO
