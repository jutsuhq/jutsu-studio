name: Bug report
description: Something in Jutsu Studio doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste an API key, a sign-in token or a signed result URL here. Security problems go to [private vulnerability reporting](https://github.com/jutsuhq/jutsu-studio/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Drop a 10 s MOV on Create
        2. Choose Restyle › Film Noir
        3. Click Draft 480p
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jutsu Studio version
      description: Jutsu Studio › About Jutsu Studio.
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.1, Apple silicon
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Higgsfield account
        - API key
        - Not connected
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mode and model
      description: If it's about a job.
      placeholder: Motion transfer on Seedance 2.5
  - type: textarea
    id: logs
    attributes:
      label: Request ID or logs
      description: A failed job's IDs (Queue › Copy IDs) or lines from Console.app filtered by subsystem `com.jutsustudio`. Check them for anything private first.
      render: text
  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: If the app crashed, attach the newest `Jutsu Studio-*.ips` from `~/Library/Logs/DiagnosticReports` (Finder › Go › Go to Folder…). It lists the app version and build, so it can be symbolicated with that release's dSYMs.
