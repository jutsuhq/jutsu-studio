# XcodeGen spec. Generate the project with `xcodegen generate`; JutsuStudio.xcodeproj is not committed.
name: JutsuStudio
options:
  bundleIdPrefix: com.jutsustudio
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  JutsuKit:
    path: Packages/JutsuKit
  HiggsfieldKit:
    path: Packages/HiggsfieldKit
  # Software Update: checks the appcast attached to the latest GitHub release, downloads, installs and relaunches.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_IDENTITY: "-"
    # Xcode fills Localizable.xcstrings from Text("…") and String(localized:) on each build.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  JutsuStudio:
    type: application
    platform: macOS
    sources: [JutsuStudio]
    dependencies:
      - package: JutsuKit
        product: JutsuCore
      - package: JutsuKit
        product: Presentation
      - package: JutsuKit
        product: Secrets
      - package: JutsuKit
        product: HiggsfieldProviders
      - package: HiggsfieldKit
        product: HiggsfieldCore
      - package: HiggsfieldKit
        product: HiggsfieldAPI
      - package: HiggsfieldKit
        product: HiggsfieldMCP
      - package: JutsuKit
        product: JobEngine
      - package: JutsuKit
        product: Persistence
      - package: JutsuKit
        product: MediaKit
      - package: JutsuKit
        product: JutsuAgent
      - package: Sparkle
      # The `jutsu` helper agents run (JutsuCLI), signed with the app so it carries the same team.
      - target: jutsu-helper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    entitlements:
      path: JutsuStudio/Resources/JutsuStudio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # The OAuth loopback redirect listens on 127.0.0.1.
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.assets.movies.read-write: true
        # Sparkle's installer runs outside the sandbox as an XPC service; the app reaches it by these names.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        # The agent socket lives in this group's container, where the unsandboxed `jutsu` helper can reach it. A
        # team-prefixed group needs no provisioning profile; an ad-hoc build has no team, and agents are off for it.
        com.apple.security.application-groups:
          - $(JUTSU_APP_GROUP)
    info:
      path: JutsuStudio/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        # The sign-in page's "Open Jutsu Studio" button (AppLink); Debug has a scheme of its own.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(APP_URL_SCHEME)]
        # Sparkle. The appcast is a release asset, so `latest/download` follows the newest published release; each
        # update is checked against this EdDSA key and the app's own code signature before it is installed.
        SUFeedURL: https://github.com/jutsuhq/jutsu-studio/releases/latest/download/appcast.xml
        # The public half of the key release.yml signs updates with (secret SPARKLE_ED_PRIVATE_KEY).
        SUPublicEDKey: RUjFlCdW3fQ0905uaHtYOCvhdtv6nKMkBc4FxFPG0N8=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # The app group, read by the app and by the `jutsu` helper to find the agent socket.
        JutsuAppGroup: $(JUTSU_APP_GROUP)
        NSHumanReadableCopyright: MIT License. Unofficial, not affiliated with Higgsfield AI.
        # Relative to Contents/Resources. XcodeGen copies Resources/Fonts/*.ttf flat into that folder.
        ATSApplicationFontsPath: "."
        # Finder's Open With and drops on the Dock icon. Alternate rank: never the default app for these files.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
    settings:
      base:
        PRODUCT_NAME: Jutsu Studio
        PRODUCT_BUNDLE_IDENTIFIER: com.jutsustudio.JutsuStudio
        APP_DISPLAY_NAME: Jutsu Studio
        APP_URL_SCHEME: jutsustudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        JUTSU_APP_GROUP: $(DEVELOPMENT_TEAM).com.jutsustudio.jutsustudio
      # Debug gets its own bundle ID, so its own sandbox container (job store, UserDefaults) and name: a Debug
      # launch must never resume the release build's paid jobs or change its settings. Release stays as it is.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jutsustudio.JutsuStudio.debug
          APP_DISPLAY_NAME: Jutsu Studio Debug
          APP_URL_SCHEME: jutsustudio-debug
          JUTSU_APP_GROUP: $(DEVELOPMENT_TEAM).com.jutsustudio.jutsustudio.debug

  # `jutsu mcp`: the MCP server agents start, bundled at Contents/Helpers/jutsu. Not sandboxed, so it can find and
  # start the app; it reaches the app only through the agent socket.
  jutsu-helper:
    type: tool
    platform: macOS
    sources: [JutsuCLI]
    dependencies:
      - package: JutsuKit
        product: JutsuAgent
      - package: JutsuKit
        product: JutsuMCP
    settings:
      base:
        PRODUCT_NAME: jutsu
        PRODUCT_BUNDLE_IDENTIFIER: com.jutsustudio.jutsu.cli
        # An Info.plist inside the binary, so its signature names it by this bundle ID.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # Installed only inside the app.
        SKIP_INSTALL: YES
      configs:
        # A Developer ID signature with hardened runtime and no debugging entitlement, as notarization requires.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
